name: "RPi LCD Dashboard"
description: "Drives the 1.69 inch SPI LCD dashboard."
version: "1.3.1"
slug: "rpi_lcd_dashboard"
arch:
  - aarch64
startup: "services"
boot: "auto"
init: false
devices:
  - "/dev/spidev0.0:/dev/spidev0.0:rwm"
  - "/dev/spidev10.0:/dev/spidev10.0:rwm"
  - "/dev/gpiochip0:/dev/gpiochip0:rwm"
gpio: true
host_network: true
host_pid: true
options:
  board_model: "Raspberry Pi 5"
  rpi_lgpio_revision: "d04170"
  spi_bus: 0
  spi_device: 0
  spi_speed: 10000000
  gpio_chip: 0
  digital_backlight: true
  pin_rst: 27
  pin_dc: 25
  pin_bl: 18
schema:
  board_model: "list(Raspberry Pi 5|Raspberry Pi 4|Raspberry Pi 3)"
  rpi_lgpio_revision: str
  spi_bus: int
  spi_device: int
  spi_speed: int
  gpio_chip: int
  digital_backlight: bool
  pin_rst: int
  pin_dc: int
  pin_bl: int
